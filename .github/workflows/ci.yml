name: CI
on:
  push:
    branches: [main, 'integration/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Private GitHub-Pakete (@hoelzle/react-ui, react-auth) brauchen Lesezugriff.
      # Secret PACKAGES_TOKEN: PAT mit Lesezugriff auf RPGFabi/React-UI und RPGFabi/React-Auth.
      # package-lock.json loest die Pakete als git+ssh auf; auch diese Formen auf HTTPS + Token umlenken.
      - run: |
          base="https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
      - name: Token-Diagnose (nur Status, kein Token)
        env:
          T: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          echo "Token-Laenge: ${#T}"
          for r in React-UI React-Auth; do
            echo "API $r: $(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $T" https://api.github.com/repos/RPGFabi/$r)"
          done
          echo "Token-Typ: $(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $T" https://api.github.com/user)"
          echo "API Contents React-UI: $(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $T" https://api.github.com/repos/RPGFabi/React-UI/contents/package.json)"
          echo "--- git ls-remote (stderr):"
          GIT_TERMINAL_PROMPT=0 GIT_TRACE_CURL_NO_DATA=1 git -c credential.helper= ls-remote "https://x-access-token:$T@github.com/RPGFabi/React-UI.git" 2>&1 | head -5 || true
          echo "--- git config global:"
          git config --global --list | sed "s/:[^@]*@/:<token>@/" || true
          echo "--- HTTP info/refs:"
          curl -s -o /dev/null -w "%{http_code}
" -u "x-access-token:$T" "https://github.com/RPGFabi/React-UI.git/info/refs?service=git-upload-pack"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
